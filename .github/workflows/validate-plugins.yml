name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "pstack/**"
      - "scripts/validate-pstack.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Validate pstack packaging and skill references
        run: node scripts/validate-pstack.mjs
